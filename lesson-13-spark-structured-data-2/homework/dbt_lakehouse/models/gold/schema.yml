version: 2

# Тести на Gold. Специфікація: ../../SPEC.md → «Тести».
# Додайте not_null / unique на грануляцію / surrogate key кожної моделі.
models:
  - name: dim_repo
    columns:
      - name: repo_id
        data_tests:
          - unique
          - not_null

  - name: dim_actor
    columns:
      - name: actor_id
        data_tests:
          - unique
          - not_null

  - name: dim_date
    columns:
      - name: date_id
        data_tests:
          - unique
          - not_null

  - name: fact_commit
    columns:
      - name: commit_sha
        data_tests:
          - unique
          - not_null

  - name: fact_pull_request
    columns:
      - name: pr_id
        data_tests:
          - unique
          - not_null

  - name: fact_repo_activity_daily
    columns:
      - name: activity_id
        data_tests:
          - unique
          - not_null
